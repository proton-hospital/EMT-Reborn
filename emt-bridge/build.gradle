plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

group = 'emt.bridge'
version = '1.0.0'
base { archivesName = 'EMT-Reborn-bridge-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'
    // MFCL public API (only API interfaces are used, they do not depend on obfuscated names)
    compileOnly files('libs/ModernForgeConnectLoader-1.0.9.jar')
    // tc-modern-lib scan API (IC2 aspects); optional at runtime
    compileOnly files('libs/tc-modern-lib-0.2.0.0.jar')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand 'version': project.version }
}

jar.finalizedBy('reobfJar')
